[package]
name = "music"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "music"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rusty_ffmpeg = { version = "0.16", features = ["link_system_ffmpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
flexi_logger = "0.31"
rayon = "1.11"
concurrent-queue = "2.5.0"
duckdb = { version = "1.3.2", features = ["bundled"] }
